name: Test Fluxer Helm Chart

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  KIND_CLUSTER_NAME: fluxer-ci-test
  NAMESPACE: fluxer
  RELEASE_NAME: fluxer

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Helm lint
        run: helm lint .
      - name: chart-testing lint
        uses: helm/chart-testing-action@v2
        with:
          version: v3.10.0
          config: .github/ct-config.yaml
      - name: ct lint all
        run: ct lint --config .github/ct-config.yaml --all

  template:
    name: Template validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Template (defaults)
        run: helm template test-release . --namespace test --debug > /dev/null
      - name: Template (e2e overrides)
        run: helm template test-release . --namespace test -f ci/values-e2e.yaml > /dev/null
      - name: Template (custom domain, no TURN)
        run: helm template test-release . --namespace test --set fluxer.domain=chat.example.com --set livekit.turn.enabled=false > /dev/null

  e2e:
    name: E2E (KinD)
    runs-on: ubuntu-latest
    needs: [lint, template]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: .github/kind-config.yaml
      - name: Install Fluxer chart
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} . \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            -f ci/values-e2e.yaml \
            --timeout 600s
      - name: Run E2E
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
          RELEASE: ${{ env.RELEASE_NAME }}
        run: bash scripts/e2e-test.sh
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          echo "=== deployments ==="
          kubectl get deployments -n ${{ env.NAMESPACE }}
          echo "=== statefulsets ==="
          kubectl get statefulsets -n ${{ env.NAMESPACE }}
          echo "=== api logs ==="
          kubectl logs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=fluxer-api --tail=80 || true
          echo "=== postgres logs ==="
          kubectl logs -n ${{ env.NAMESPACE }} sts/postgres-0 --tail=40 || true
