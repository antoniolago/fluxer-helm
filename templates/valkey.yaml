apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceNames.valkey }}
  namespace: {{ include "fluxer.namespace" . }}
  labels:
    app.kubernetes.io/name: fluxer-valkey
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fluxer-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.serviceNames.valkey }}
  namespace: {{ include "fluxer.namespace" . }}
  labels:
    app.kubernetes.io/name: fluxer-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxer-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluxer-valkey
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: valkey
          image: {{ .Values.images.valkey | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - valkey-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          resources:
{{ toYaml .Values.valkey.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
