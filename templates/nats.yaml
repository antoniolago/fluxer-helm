apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceNames.nats }}
  namespace: {{ include "fluxer.namespace" . }}
  labels:
    app.kubernetes.io/name: fluxer-nats
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fluxer-nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
    - name: monitor
      port: 8222
      targetPort: 8222
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.serviceNames.nats }}
  namespace: {{ include "fluxer.namespace" . }}
  labels:
    app.kubernetes.io/name: fluxer-nats
spec:
  serviceName: {{ .Values.serviceNames.nats }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxer-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluxer-nats
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: nats
          image: {{ .Values.images.nats | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - -js
            - -sd
            - /data
            - -m
            - "8222"
          ports:
            - name: client
              containerPort: 4222
              protocol: TCP
            - name: monitor
              containerPort: 8222
              protocol: TCP
          resources:
{{ toYaml .Values.nats.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.storage.nats.class }}
        resources:
          requests:
            storage: {{ .Values.storage.nats.size }}
