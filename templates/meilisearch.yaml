apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceNames.meilisearch }}
  namespace: {{ include "fluxer.namespace" . }}
  labels:
    app.kubernetes.io/name: fluxer-meilisearch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fluxer-meilisearch
  ports:
    - name: http
      port: 7700
      targetPort: 7700
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.serviceNames.meilisearch }}
  namespace: {{ include "fluxer.namespace" . }}
  labels:
    app.kubernetes.io/name: fluxer-meilisearch
spec:
  serviceName: {{ .Values.serviceNames.meilisearch }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxer-meilisearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluxer-meilisearch
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: meilisearch
          image: {{ .Values.images.meilisearch | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: MEILI_ENV
              value: production
            - name: MEILI_NO_ANALYTICS
              value: "true"
          envFrom:
            - secretRef:
                name: {{ include "fluxer.secretName" . }}
                optional: false
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          resources:
{{ toYaml .Values.meilisearch.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 7700
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 7700
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /meili_data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.storage.meilisearch.class }}
        resources:
          requests:
            storage: {{ .Values.storage.meilisearch.size }}
