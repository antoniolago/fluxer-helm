apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceNames.postgres }}
  namespace: {{ include "fluxer.namespace" . }}
  labels:
    app.kubernetes.io/name: fluxer-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fluxer-postgres
  ports:
    - name: postgresql
      port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.serviceNames.postgres }}
  namespace: {{ include "fluxer.namespace" . }}
  labels:
    app.kubernetes.io/name: fluxer-postgres
spec:
  serviceName: {{ .Values.serviceNames.postgres }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxer-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluxer-postgres
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - listen_addresses=*
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: {{ include "fluxer.secretName" . }}
                optional: false
          ports:
            - name: postgresql
              containerPort: {{ .Values.postgres.port }}
              protocol: TCP
          resources:
            limits:
              cpu: 1
            requests:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - {{ .Values.postgres.port | quote }}
                - -U
                - {{ .Values.postgres.user | quote }}
                - -d
                - {{ .Values.postgres.database | quote }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - {{ .Values.postgres.port | quote }}
                - -U
                - {{ .Values.postgres.user | quote }}
                - -d
                - {{ .Values.postgres.database | quote }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.storage.postgres.class }}
        resources:
          requests:
            storage: {{ .Values.storage.postgres.size }}
